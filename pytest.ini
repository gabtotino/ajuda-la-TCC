[pytest]
testpaths = tests
addopts = -q
# datetime.utcnow() está depreciado no Python 3.12+, mas é o padrão usado
# pelos models desde a Etapa 2; migrar para datetimes com fuso fica como
# melhoria futura e não afeta o comportamento.
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
