<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo Ajuda-Lá">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#logoGradient)"/>
  <!-- Dois círculos sobrepostos representam a conexão entre contratante e prestador -->
  <circle cx="25" cy="32" r="13" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="39" cy="32" r="13" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
