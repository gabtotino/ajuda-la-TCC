{% extends "base.html" %}

{% block title %}Editar tarefa — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container page-top">
    <div class="form-wrapper">
        <div class="form-card">
            <h1 class="page-title">Editar tarefa</h1>
            <p class="form-card-subtitle">Quem já se candidatou verá as informações atualizadas.</p>

            <form method="POST" action="{{ url_for('tasks.edit', task_id=task.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% include "tasks/_form_fields.html" %}
                <button type="submit" class="btn btn-primary btn-block">Salvar alterações</button>
            </form>

            <p class="form-hint"><a href="{{ url_for('tasks.detail', task_id=task.id) }}">Cancelar edição</a></p>
        </div>
    </div>
</div>
{% endblock %}
