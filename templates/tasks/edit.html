{% extends "base.html" %}

{% block title %}Editar tarefa — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container page-top">
    <div class="form-wrapper">
        <div class="form-card">
            <h2>Editar tarefa</h2>
            <p class="form-card-subtitle">Status atual: <strong>{{ task.status.replace('_', ' ') }}</strong></p>

            <form method="POST" action="{{ url_for('tasks.edit', task_id=task.id) }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" value="{{ title }}" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" name="category" required>
                            {% for cat in categories %}
                                <option value="{{ cat }}" {% if cat == category %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="value">Valor (R$)</label>
                        <input type="text" id="value" name="value" value="{{ value }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Localização</label>
                    <input type="text" id="location" name="location" value="{{ location }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" name="description" rows="5">{{ description }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Salvar alterações</button>
            </form>

            <p class="form-hint"><a href="{{ url_for('tasks.detail', task_id=task.id) }}">Cancelar</a></p>
        </div>
    </div>
</div>
{% endblock %}
