{% extends "base.html" %}

{% block title %}Publicar tarefa — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container page-top">
    <div class="form-wrapper">
        <div class="form-card">
            <h1 class="page-title">Publicar uma tarefa</h1>
            <p class="form-card-subtitle">Quanto mais claro o pedido, melhores as candidaturas que você recebe.</p>

            <!-- Assistente de IA: interpreta um texto livre e pré-preenche os
                 campos abaixo. Se a chamada falhar, o usuário preenche o
                 formulário normalmente. -->
            <div class="ai-box">
                <label for="ai-assist-text"><strong>✨ Descreva com suas palavras</strong> <span class="optional">(opcional)</span></label>
                <textarea id="ai-assist-text" rows="2" placeholder='Ex.: "preciso lavar meu carro no sábado, pago 50 reais"'></textarea>
                <button type="button" id="ai-assist-button" class="btn btn-outline-primary btn-sm">Preencher com IA</button>
                <p class="ai-status" id="ai-assist-status" role="status"></p>
            </div>

            <form method="POST" action="{{ url_for('tasks.create') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% include "tasks/_form_fields.html" %}
                <button type="submit" class="btn btn-primary btn-block">Publicar tarefa</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/ai-assistant.js', v=asset_version) }}"></script>
{% endblock %}
