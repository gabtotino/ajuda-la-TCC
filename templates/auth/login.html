{% extends "base.html" %}

{% block title %}Entrar — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Entrar</h2>

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <p class="form-hint">Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}
