{% extends "base.html" %}

{% block title %}Criar conta — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Criar conta</h2>

            <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
                <!-- Token CSRF: gerado por sessão em utils.py, conferido em routes/auth.py -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" value="{{ name or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label>Eu quero</label>
                    <div class="form-check">
                        <input type="radio" id="role_contractor" name="role" value="contractor" checked>
                        <label for="role_contractor">Contratar ajuda para tarefas</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="role_provider" name="role" value="provider">
                        <label for="role_provider">Prestar serviços</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
            </form>

            <p class="form-hint">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
        </div>
    </div>
</div>
{% endblock %}
