{% extends "base.html" %}

{% block title %}Editar perfil — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Editar perfil</h2>

            <form method="POST" action="{{ url_for('profile.edit_profile') }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" value="{{ name }}" required>
                </div>

                <div class="form-group">
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="city" value="{{ city }}" placeholder="Ex.: São Paulo, SP">
                </div>

                <div class="form-group">
                    <label for="bio">Sobre você</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Conte um pouco sobre você...">{{ bio }}</textarea>
                </div>

                <div class="form-group">
                    <label>Papéis</label>
                    <div class="form-check">
                        <input type="checkbox" id="is_contractor" name="is_contractor" {% if is_contractor %}checked{% endif %}>
                        <label for="is_contractor">Contratar ajuda para tarefas</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="is_provider" name="is_provider" {% if is_provider %}checked{% endif %}>
                        <label for="is_provider">Prestar serviços</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Salvar alterações</button>
            </form>

            <p class="form-hint"><a href="{{ url_for('profile.view_profile', user_id=current_user.id) }}">Cancelar</a></p>
        </div>
    </div>
</div>
{% endblock %}
