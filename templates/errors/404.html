{% extends "base.html" %}

{% block title %}Página não encontrada — Ajuda-Lá{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-code">404</div>
        <h2>Essa página não existe</h2>
        <p>O link que você seguiu pode estar quebrado, ou a página pode ter sido removida.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary">Voltar para a home</a>
    </div>
</div>
{% endblock %}
